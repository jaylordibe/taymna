# Pinned so the network is always `taymna_default` and containers are
# `taymna-api` / `taymna-web` regardless of the checkout directory -- other
# containers (e.g. a reverse proxy) can reference them by these names.
name: taymna

services:
  postgres:
    image: postgres:17-alpine
    container_name: taymna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: taymna-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host side is configurable: BIND_ADDRESS=127.0.0.1 keeps both
      # services off the public interface when a reverse proxy fronts them,
      # and API_PORT/WEB_PORT avoid clashing with other apps on a shared
      # server (3000/3001 are common Node defaults). The container side is
      # always 3000 -- see docs/deploy-ubuntu-vps.md.
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AGENT_SERVER_URL: ${NEXT_PUBLIC_AGENT_SERVER_URL:-}
    container_name: taymna-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3001}:3000"

volumes:
  postgres-data:
