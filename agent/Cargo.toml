[package]
name = "taymna-agent"
version = "0.1.0"
edition = "2021"
description = "Taymna machine agent: enrolls a computer, holds a persistent connection to the Taymna server, and enforces session expiry locally."
license = "Apache-2.0"

[[bin]]
name = "taymna-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Environment",
] }
# Implements the Service Control Manager handshake (StartServiceCtrlDispatcherW
# and friends) that `sc.exe start` requires -- without this, SCM waits for a
# "running" status the process never sends and start fails with error 1053.
windows-service = "0.8"
# A Windows service has no attached console, so tracing_subscriber's default
# stdout writer goes nowhere -- this gives the service path a log file to
# write to instead, so a failure is diagnosable without a debugger attached.
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
