name: api & web

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taymna
          POSTGRES_PASSWORD: taymna
          POSTGRES_DB: taymna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taymna -d taymna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taymna:taymna@localhost:5432/taymna
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      WEB_ORIGIN: http://localhost:3001
      HEARTBEAT_TIMEOUT_SECONDS: "60"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:e2e

      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
